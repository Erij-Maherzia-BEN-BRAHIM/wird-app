name: Deploy functions

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  functions:
    name: Functions → Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check token (never printed)
        run: |
          T="$SUPABASE_ACCESS_TOKEN"
          if [ -z "$T" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is empty or missing. Add it under Settings > Secrets and variables > Actions > Secrets (not Variables)."; exit 1
          fi
          case "$T" in
            sbp_*) echo "Token format looks right (length ${#T})." ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN does not start with sbp_ (length ${#T}). Create a personal access token at supabase.com/dashboard/account/tokens."; exit 1 ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        run: |
          for fn in api reminder; do
            if out=$(supabase functions deploy "$fn" --project-ref lhfeydrxunxaaxlgfpef --no-verify-jwt --use-api 2>&1); then
              echo "$out"
            else
              echo "$out"
              echo "::error title=deploy $fn failed::$(echo "$out" | tail -4 | tr '\n' ' ')"
              exit 1
            fi
          done
