name: Deploy functions

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  functions:
    name: Functions → Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy edge functions
        run: |
          supabase functions deploy api --project-ref lhfeydrxunxaaxlgfpef --no-verify-jwt
          supabase functions deploy reminder --project-ref lhfeydrxunxaaxlgfpef --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
